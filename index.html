<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finger Magic ✨</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #02020a;
    font-family: Arial;
    color: white;
}

#video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0.22;
}

#canvas {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

.title {
    position: fixed;
    top: 25px;
    width: 100%;
    text-align: center;
    z-index: 5;
}

.title h1 {
    margin: 0;
    font-size: 32px;
}

.title p {
    opacity: 0.7;
}

.status {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 18px;
    border-radius: 20px;
    background: rgba(255,255,255,0.12);
    z-index: 5;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="title">
    <h1>✨ Finger Magic</h1>
    <p>Move your index finger to create magic</p>
</div>

<div class="status" id="status">
    ☝️ Show your index finger
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

let particles = [];

let fingerX = 0;
let fingerY = 0;

let fingerVisible = false;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


/* PARTICLE */

class Particle {

    constructor(x, y) {

        this.x = x;
        this.y = y;

        this.vx = (Math.random() - 0.5) * 3;
        this.vy = (Math.random() - 0.5) * 3;

        this.size = Math.random() * 3 + 1;

        this.life = 1;

        this.decay =
            Math.random() * 0.015 + 0.01;
    }

    update() {

        this.x += this.vx;
        this.y += this.vy;

        this.vx *= 0.97;
        this.vy *= 0.97;

        this.life -= this.decay;
    }

    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(150,230,255,${this.life})`;

        ctx.shadowBlur = 15;

        ctx.shadowColor =
            "rgba(100,220,255,1)";

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}


/* CREATE MAGIC ONLY AT FINGER */

function createFingerMagic(x, y) {

    for (let i = 0; i < 7; i++) {

        particles.push(
            new Particle(
                x + (Math.random() - 0.5) * 12,
                y + (Math.random() - 0.5) * 12
            )
        );
    }

    if (particles.length > 500) {

        particles.splice(
            0,
            particles.length - 500
        );
    }
}


/* ANIMATION */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (fingerVisible) {

        /* Magic follows ONLY index finger */

        createFingerMagic(
            fingerX,
            fingerY
        );


        /* Finger glow */

        ctx.beginPath();

        ctx.arc(
            fingerX,
            fingerY,
            7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,255,255,1)";

        ctx.shadowBlur = 30;

        ctx.shadowColor =
            "rgba(100,220,255,1)";

        ctx.fill();

        ctx.shadowBlur = 0;
    }


    particles.forEach(p => {

        p.update();
        p.draw();

    });


    particles =
        particles.filter(
            p => p.life > 0
        );


    requestAnimationFrame(animate);
}

animate();


/* HAND TRACKING */

const hands = new Hands({

    locateFile: file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

});

hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


hands.onResults(results => {

    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ) {

        const hand =
            results.multiHandLandmarks[0];


        /*
         INDEX FINGER TIP = LANDMARK 8
         */

        const indexTip = hand[8];


        fingerX =
            (1 - indexTip.x) *
            canvas.width;

        fingerY =
            indexTip.y *
            canvas.height;


        fingerVisible = true;


        status.innerText =
            "☝️ Index finger detected — Move it! ✨";

    }

    else {

        fingerVisible = false;

        status.innerText =
            "☝️ Show your index finger";

    }

});


/* CAMERA */

const camera = new Camera(video, {

    onFrame: async () => {

        await hands.send({
            image: video
        });

    },

    width: 1280,
    height: 720

});

camera.start();

</script>

</body>
</html>
