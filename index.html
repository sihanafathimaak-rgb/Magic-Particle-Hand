<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magic Particle Hand</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: #02020a;
        font-family: Arial, sans-serif;
        color: white;
    }

    #video {
        position: fixed;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        opacity: 0.25;
    }

    #canvas {
        position: fixed;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
    }

    .title {
        position: fixed;
        top: 25px;
        left: 0;
        width: 100%;
        text-align: center;
        z-index: 5;
    }

    .title h1 {
        margin: 0;
        font-size: 32px;
    }

    .title p {
        margin-top: 8px;
        opacity: 0.7;
    }

    .status {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        padding: 10px 18px;
        border-radius: 20px;
        background: rgba(255,255,255,0.12);
    }
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div class="title">
    <h1>✨ Magic Particle Hand</h1>
    <p>Move your index finger and control the magic</p>
</div>

<div class="status" id="status">
    Starting camera...
</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

let particles = [];

let targetX = window.innerWidth / 2;
let targetY = window.innerHeight / 2;

let previousX = targetX;
let previousY = targetY;

let handDetected = false;


function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);



/* PARTICLE */

class Particle {

    constructor(x, y) {

        this.x = x;
        this.y = y;

        this.vx = (Math.random() - 0.5) * 5;
        this.vy = (Math.random() - 0.5) * 5;

        this.size = Math.random() * 3 + 1;

        this.life = 1;

        this.decay = Math.random() * 0.015 + 0.008;
    }


    update() {

        this.x += this.vx;
        this.y += this.vy;

        this.vx *= 0.96;
        this.vy *= 0.96;

        this.life -= this.decay;

    }


    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(100,220,255,${this.life})`;

        ctx.shadowBlur = 18;

        ctx.shadowColor =
            "rgba(100,220,255,0.9)";

        ctx.fill();

        ctx.shadowBlur = 0;

    }

}



/* CREATE MAGIC */

function createMagic(x, y) {

    for (let i = 0; i < 15; i++) {

        particles.push(

            new Particle(

                x + (Math.random() - 0.5) * 35,

                y + (Math.random() - 0.5) * 35

            )

        );

    }


    if (particles.length > 900) {

        particles.splice(
            0,
            particles.length - 900
        );

    }

}



/* ANIMATION */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (handDetected) {

        /*
        Create particles at
        CURRENT finger position
        */

        createMagic(targetX, targetY);


        /*
        Draw a small glowing circle
        at the current finger position
        */

        ctx.beginPath();

        ctx.arc(
            targetX,
            targetY,
            8,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(180,240,255,0.9)";

        ctx.shadowBlur = 30;

        ctx.shadowColor =
            "rgba(100,220,255,1)";

        ctx.fill();

        ctx.shadowBlur = 0;

    }


    /* Update particles */

    particles.forEach(p => {

        p.update();

        p.draw();

    });


    /* Remove dead particles */

    particles =
        particles.filter(
            p => p.life > 0
        );


    requestAnimationFrame(animate);

}


animate();



/* MEDIAPIPE */

const hands = new Hands({

    locateFile: (file) => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

});


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});



/* HAND DETECTION */

hands.onResults(results => {

    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ) {

        const hand =
            results.multiHandLandmarks[0];


        /*
        Landmark 8 =
        Index finger tip
        */

        const finger =
            hand[8];


        /*
        Convert camera position
        to screen position
        */

        targetX =
            (1 - finger.x) *
            canvas.width;

        targetY =
            finger.y *
            canvas.height;


        handDetected = true;


        status.innerText =
            "🖐️ Hand detected — Move your finger! ✨";

    }

    else {

        handDetected = false;

        status.innerText =
            "🖐️ Show your hand to the camera";

    }

});



/* CAMERA */

const camera = new Camera(video, {

    onFrame: async () => {

        await hands.send({
            image: video
        });

    },

    width: 1280,

    height: 720

});


camera.start();

</script>

</body>
</html>
