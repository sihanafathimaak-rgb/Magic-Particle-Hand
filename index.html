<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Magic Particle Hand</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #050510;
            font-family: Arial, sans-serif;
            color: white;
        }

        #video {
            position: fixed;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.25;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .title {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 5;
        }

        .title h1 {
            margin: 0;
            font-size: 32px;
        }

        .title p {
            margin-top: 8px;
            opacity: 0.7;
        }

        .status {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            padding: 10px 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>

<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="title">
        <h1>✨ Magic Particle Hand</h1>
        <p>Move your hand and control the magic</p>
    </div>

    <div class="status" id="status">
        Starting camera...
    </div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>

        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const status = document.getElementById("status");

        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        class Particle {

            constructor(x, y) {
                this.x = x;
                this.y = y;

                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;

                this.size = Math.random() * 4 + 1;
                this.life = 1;
            }

            update(targetX, targetY) {

                const dx = targetX - this.x;
                const dy = targetY - this.y;

                this.vx += dx * 0.002;
                this.vy += dy * 0.002;

                this.vx *= 0.96;
                this.vy *= 0.96;

                this.x += this.vx;
                this.y += this.vy;

                this.life -= 0.008;
            }

            draw() {

                ctx.beginPath();

                ctx.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(120,220,255,${this.life})`;

                ctx.fill();
            }
        }

        function createParticles(x, y) {

            for (let i = 0; i < 8; i++) {

                particles.push(
                    new Particle(
                        x + (Math.random() - 0.5) * 30,
                        y + (Math.random() - 0.5) * 30
                    )
                );
            }

            if (particles.length > 800) {
                particles.splice(0, particles.length - 800);
            }
        }

        function animate(targetX, targetY) {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            createParticles(targetX, targetY);

            particles.forEach(p => {
                p.update(targetX, targetY);
                p.draw();
            });

            particles =
                particles.filter(p => p.life > 0);

            requestAnimationFrame(() =>
                animate(targetX, targetY)
            );
        }

        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(results => {

            if (
                results.multiHandLandmarks &&
                results.multiHandLandmarks.length > 0
            ) {

                const hand =
                    results.multiHandLandmarks[0];

                const finger =
                    hand[8];

                const x =
                    (1 - finger.x) * canvas.width;

                const y =
                    finger.y * canvas.height;

                status.innerText =
                    "🖐️ Hand detected — Magic activated!";

                if (!window.magicStarted) {
                    window.magicStarted = true;
                    animate(x, y);
                }

                window.targetX = x;
                window.targetY = y;

            } else {

                status.innerText =
                    "🖐️ Show your hand to the camera";
            }
        });

        const camera = new Camera(video, {

            onFrame: async () => {
                await hands.send({
                    image: video
                });
            },

            width: 1280,
            height: 720

        });

        camera.start();

    </script>

</body>
</html>
